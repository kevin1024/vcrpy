[project]
name = "vcrpy"
authors = [{name = "Kevin McCarthy", email = "me@kevinmccarthy.org"}]
license = {text = "MIT"}
description = "Automatically mock your HTTP interactions to simplify and speed up testing"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: MIT License",
]
urls = {Homepage = "https://github.com/kevin1024/vcrpy"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "typing_extensions>=4.6; python_version < '3.13'",
    "wrapt",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
tests = [
    "aiohttp",
    "boto3",
    "cryptography",
    "httpbin>=0.10.3",
    "httplib2",
    "httpx",
    "httpx-curl-cffi",
    "httpx2",
    "pycurl; platform_python_implementation != 'PyPy'",
    "pyreqwest",
    "pysocks",
    "pytest",
    "pytest-aiohttp",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-httpbin",
    "requests>=2.22.0",
    "tornado",
    "urllib3",
]
tests-niquests = [
    "httpbin>=0.10.3",
    "pytest",
    "pytest-aiohttp",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-httpbin",
    "niquests",
]
tests-urllib3-1 = [
    "httpbin>=0.10.3",
    "pysocks",
    "pytest",
    "pytest-aiohttp",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-httpbin",
    "requests>=2.22.0",
    "urllib3<2",
]
typing = [
    "vcrpy[tests]",
    "botocore-stubs",
    "mypy",
    "pyright",
    "types-PyYAML",
    "types-httplib2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
vcr = ["py.typed"]

[tool.setuptools.packages.find]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "vcr.__version__"}

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[tool.codespell]
skip = '.git,*.pdf,*.svg,.tox'
ignore-regex = "\\\\[fnrstv]"

[tool.pytest]
addopts = ["--strict-config", "--strict-markers"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["online"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "COM", # flake8-commas
    "E",   # pycodestyle error
    "F",   # pyflakes
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "UP",  # pyupgrade
    "W",   # pycodestyle warning
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["vcr"]

[tool.mypy]
python_version = "3.11"
files = ["vcr", "tests/typing"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# Optional integrations that are not necessarily installed
module = ["httpx_curl_cffi"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The connection stubs combine a VCR mixin with the real connection class of
# each library and swap `_baseclass`/`endheaders`; the type system cannot
# express that.
module = [
    "vcr.stubs.boto3_stubs",
    "vcr.stubs.httplib2_stubs",
    "vcr.stubs.requests_stubs",
    "vcr.stubs.urllib3_stubs",
]
disable_error_code = ["misc", "assignment"]

[[tool.mypy.overrides]]
# The public API, which is fully annotated. The HTTP library stubs and the
# patching machinery aren't yet.
module = [
    "vcr",
    "vcr._handle_coroutine",
    "vcr.cassette",
    "vcr.config",
    "vcr.errors",
    "vcr.filters",
    "vcr.matchers",
    "vcr.persisters.*",
    "vcr.record_mode",
    "vcr.request",
    "vcr.serialize",
    "vcr.serializers.*",
    "vcr.types",
    "vcr.unittest",
    "vcr.util",
    "tests.typing.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pyright]
pythonVersion = "3.11"
include = ["vcr", "tests/typing"]
exclude = ["vcr/stubs", "vcr/patch.py", "vcr/migration.py"]
# Strict for what users of vcrpy see; the implementation is checked in standard mode.
strict = ["vcr/types.py", "tests/typing"]
